
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Becky Kitchen{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand">Becky Kitchen</div>

        <div class="nav-links">
            {% if session.get('user_id') %}
                <span class="nav-user">
                    Hello, {{ session.get('username') }}!
                </span>

                <a href="{{ url_for('logout') }}" class="btn-logout">
                    Logout
                </a>
            {% endif %}
        </div>
    </nav>

    <main class="page-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
